[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"


[project]
name = "sqlite2duckdb"
version = "0.5.0"
authors = [{name="Sacha Schutz", email="sacha.schutz@pm.me"}]
description = "Convert a SQLite database into a DuckDB database — tables, indexes and views, in one command"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "sqlite",
    "sqlite3",
    "duckdb",
    "database",
    "olap",
    "oltp",
    "migration",
    "converter",
    "etl",
    "analytics",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    'duckdb >= 1.1.0'
]


[project.urls]
Homepage = "https://github.com/dridk/sqlite2duckdb"
Repository = "https://github.com/dridk/sqlite2duckdb"
Documentation = "https://github.com/dridk/sqlite2duckdb#readme"
Changelog = "https://github.com/dridk/sqlite2duckdb/releases"
Issues = "https://github.com/dridk/sqlite2duckdb/issues"

[project.scripts]
sqlite2duckdb = "sqlite2duckdb.__main__:main_cli"

[dependency-groups]
dev = [
    "pytest >= 7.0",
    "faker",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["sqlite2duckdb"]

# Allow list rather than a deny list, so that anything new landing in the repo
# stays out of the distribution unless it is explicitly wanted.
[tool.hatch.build.targets.sdist]
include = ["sqlite2duckdb", "tests", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
extend-select = ["I", "UP"]
